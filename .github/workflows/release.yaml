name: '🚀 Release Plugin'

# Push a tag like v1.0.0 to build the plugin, attach the zip to a GitHub release
# and add the version to manifest.json (the Jellyfin plugin repository).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          while [ "$(echo "$v" | tr -cd . | wc -c)" -lt 3 ]; do v="$v.0"; done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.ImdbSync/Jellyfin.Plugin.ImdbSync.csproj -c Release -o out \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:AssemblyVersion=${{ steps.v.outputs.version }} \
            -p:FileVersion=${{ steps.v.outputs.version }}
          zip -j "imdb-sync_${{ steps.v.outputs.version }}.zip" out/Jellyfin.Plugin.ImdbSync.dll
          echo "MD5=$(md5sum imdb-sync_*.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          git fetch origin master
          git checkout master

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" imdb-sync_*.zip --title "IMDb Sync ${{ steps.v.outputs.version }}" --generate-notes

      - name: Update manifest.json
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/imdb-sync_${{ steps.v.outputs.version }}.zip"
          python3 .github/scripts/update_manifest.py "${{ steps.v.outputs.version }}" "$url" "$MD5"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${{ steps.v.outputs.version }} to plugin manifest"
          git push origin master
